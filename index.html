<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <title>CGFexample</title>    
    <link rel="icon" href="data:,">

<style>
body, html {
    border: 0;
    padding: 0;
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

canvas {
    width: 100%;
    height: 100%;
}

/* Overlay de Jogo */
#game-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.85);
    color: white;
    padding: 40px 60px;
    border-radius: 15px;
    text-align: center;
    display: none;
    z-index: 100;
    border: 3px solid #ffcc00;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

#game-overlay h1 {
    font-size: 48px;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 3px;
}

#game-overlay p {
    font-size: 20px;
    margin-bottom: 30px;
    color: #ccc;
}

#restart-button {
    background: #ffcc00;
    color: black;
    border: none;
    padding: 15px 40px;
    font-size: 22px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
}

#restart-button:hover {
    background: #ffaa00;
    transform: scale(1.05);
}

/* HUD Bottom */
#hud-bottom {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0, 0, 0, 0.6);
    color: #ffcc00;
    padding: 10px 25px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    border: 2px solid rgba(255, 204, 0, 0.5);
    pointer-events: none;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.hud-group {
    display: flex;
    align-items: center;
    gap: 12px;
}

.hud-label {
    font-size: 14px;
    text-transform: uppercase;
    color: #ccc;
    letter-spacing: 1px;
}

/* HP Bar Styles */
.hp-bar-container {
    width: 200px;
    height: 18px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 204, 0, 0.3);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
}

#hp-fill {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff0000, #00ff00);
    transition: width 0.3s ease-out;
}
</style>
</head>
<body>

<div id="game-overlay">
    <h1 id="status-title"></h1>
    <p id="status-message"></p>
    <button id="restart-button"></button>
</div>

<div id="hud-bottom">
    <div class="hud-group">
        <span class="hud-label">HP</span>
        <div class="hp-bar-container">
            <div id="hp-fill"></div>
        </div>
    </div>

    <div style="width: 2px; height: 30px; background: rgba(255,204,0,0.2);"></div>
    
    <div class="hud-group">
        <span class="hud-label">Time</span>
        <span id="time-display">00:00</span>
    </div>

    <div style="width: 2px; height: 30px; background: rgba(255,204,0,0.2);"></div>

    <div class="hud-group">
        <span class="hud-label">Bales</span>
        <span id="bales-delivered">0/15</span>

        </div>
    </div>
</div>

<script type="module" src="main.js"></script>

</body>
</html>
